<!DOCTYPE html>
<html>
<head>
    <title>To Do List</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: lightblue;
        }

        .container {
            background: white;
            width: 300px;
            margin: 100px auto;
            padding: 20px;
            border-radius: 10px;
        }

        input {
            padding: 8px;
        }

        button {
            padding: 8px;
            background: rgb(54, 187, 54);
            color: white;
            border: none;
        }

        li {
            margin: 10px;
            text-align: left;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>To Do List</h2>

    <input type="text" id="task" placeholder="Enter task">
    <button onclick="addTask()">Add</button>

    <ul id="list"></ul>
</div>
<div id = "visibleTask"></div>
<h3>Task List</h3>
<script>
    function addTask() {
        let task = document.getElementById("task").value;

        if (task == "") {
            alert("Enter a task");
        }
        else {
            let li = document.createElement("li");
            li.innerHTML = task;

            document.getElementById("list").appendChild(li);

            document.getElementById("task").value = "";
        }

    let varsh=documnet.createElement("h1");
    varsh.textContent="";
    


     }
</script>

</body>
</html>
